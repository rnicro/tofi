# Low-latency top ribbon for dwl + tofi-run.
#
# IMPORTANT: replace the font path below with a real font file installed
# on your system. Find one with:
#   fc-match -f '%{file}\n' 'DejaVu Sans Mono'
#
# Passing a file path lets tofi use its direct HarfBuzz/Cairo font path
# instead of performing Pango/Fontconfig font-name lookup at startup.

font = "/path/to/DejaVuSansMono.ttf"
font-size = 14
hint-font = false

prompt-text = "run: "
prompt-padding = 8

# Horizontal mode with a fixed result count avoids auto-sizing every result.
horizontal = true
num-results = 8
result-spacing = 12

# Compact top ribbon; exclusive-zone=0 lets the compositor's reserved bar area
# be respected when it advertises a layer-shell exclusive zone.
width = 100%
height = 44
anchor = top
exclusive-zone = 0

background-color = #1E1E2E
text-color = #CDD6F4
selection-color = #89B4FA

outline-width = 0
border-width = 0
corner-radius = 0
padding-top = 4
padding-bottom = 4
padding-left = 12
padding-right = 12
clip-to-padding = true

history = true
matching-algorithm = normal
require-match = true

# Keep these conservative: delayed keyboard init can miss early keypresses,
# and ASCII-only mode reduces Unicode matching correctness.
late-keyboard-init = false
ascii-input = false
