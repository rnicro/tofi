# Based on rnicro/setup/HOME/.config/tofi/config.
# This profile keeps the current top ribbon and direct font-file loading.
#
# A font path skips Pango/Fontconfig font-name lookup and uses tofi's
# direct HarfBuzz/Cairo path. Keep this path valid on the target machine.

font=/usr/share/fonts/noto/NotoSansMono-Regular.ttf
font-size=14

# Only affects the direct font-file path. Try false for less startup/render
# work; switch back to true if glyphs look less crisp at your display scale.
hint-font=false

background-color=#000000
text-color=#b8bec6
prompt-color=#8b9199
placeholder-color=#8b9199
input-color=#b8bec6
selection-color=#b8bec6
selection-background=#24282d
selection-background-padding=-1, 8
selection-match-color=#ffffff

anchor=top
width=100%
height=30
horizontal=true

outline-width=0
border-width=0
padding-top=2
padding-bottom=0
padding-left=8
padding-right=8
clip-to-padding=false

prompt-text=>
prompt-padding=8
min-input-width=260

# Keep 0 to display as many results as fit. Upstream notes that a fixed
# value can reduce horizontal-layout sizing work, but it also caps results.
# Try 8 only if limiting the number of displayed choices is acceptable.
num-results=0
# num-results=8

result-spacing=20
history=false
drun-launch=true

# Keep Unicode matching correct and avoid the early-keypress caveat.
ascii-input=false
late-keyboard-init=false
